name: hotel-offer-orchestrator

services:
  # --- infrastructure ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
    ports:
      - '7233:7233'
    healthcheck:
      # Prefer the modern CLI, fall back to tctl on older auto-setup images.
      test:
        - CMD-SHELL
        - >-
          temporal operator cluster health --address temporal:7233 ||
          tctl --address temporal:7233 cluster health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Optional web UI for inspecting workflow executions: http://localhost:8080
  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - '8080:8080'

  # --- application ------------------------------------------------------------
  api:
    build: .
    command: ['node', 'dist/api/server.js']
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      SERVICE_NAME: api
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offers
      REDIS_URL: redis://redis:6379
      # The mock suppliers are served by this same process.
      SUPPLIER_BASE_URL: http://localhost:3000
      SUPPLIER_LATENCY_MS: ${SUPPLIER_LATENCY_MS:-150}
      # Landing-page admin login (adds/removes supplier hotels, simulates outages).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - '3000:3000'
    healthcheck:
      # /health returns 503 when a dependency is down, so treat any response as live.
      test: ['CMD-SHELL', 'curl -sf -o /dev/null http://localhost:3000/health || [ $$? -eq 22 ]']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build: .
    command: ['node', 'dist/temporal/worker.js']
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      SERVICE_NAME: worker
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offers
      REDIS_URL: redis://redis:6379
      # Activities reach the mock suppliers through the API container.
      SUPPLIER_BASE_URL: http://api:3000
      SUPPLIER_TIMEOUT_MS: ${SUPPLIER_TIMEOUT_MS:-5000}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
